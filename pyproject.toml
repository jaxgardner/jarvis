[project]
name = "jarvis"
version = "0.1.0"
description = "Personal assistant — two-tier voice capture on a Mac Mini"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "mcp>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
