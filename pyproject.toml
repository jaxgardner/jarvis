[project]
name = "jarvis"
version = "0.1.0"
description = "Personal assistant — two-tier voice capture on a Mac Mini"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.40",
    # APNs is HTTP/2-only, hence the extra. PyJWT signs the ES256 provider
    # token — hand-rolling that means hand-rolling the DER-to-raw signature
    # conversion, which is the one part of this that fails silently.
    "httpx[http2]>=0.27",
    "pyjwt[crypto]>=2.9",
    "python-dotenv>=1.0",
    "mcp>=2.0.0",
    # FastAPI's UploadFile is multipart/form-data, which Starlette will not
    # parse without this. Absent it, the receipts endpoint fails at import.
    "python-multipart>=0.0.9",
    # Local TTS. The onnxruntime build of Kokoro-82M, not the reference
    # `kokoro` package — same weights, a seventh of the install, and no
    # PyTorch in a repo whose dependency list should stay readable.
    "kokoro-onnx>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
