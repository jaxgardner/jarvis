[project]
name = "jarvis"
version = "0.1.0"
description = "Personal assistant — two-tier voice capture on a Mac Mini"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.40",
    # APNs is HTTP/2-only, hence the extra. PyJWT signs the ES256 provider
    # token — hand-rolling that means hand-rolling the DER-to-raw signature
    # conversion, which is the one part of this that fails silently.
    "httpx[http2]>=0.27",
    "pyjwt[crypto]>=2.9",
    "python-dotenv>=1.0",
    "mcp>=2.0.0",
    # FastAPI's UploadFile is multipart/form-data, which Starlette will not
    # parse without this. Absent it, the receipts endpoint fails at import.
    "python-multipart>=0.0.9",
    # Local TTS, in two stages. Piper speaks (VITS over onnxruntime, ~45x
    # realtime); Kanade then converts that audio toward a reference clip,
    # which is what makes it the assistant's voice rather than Piper's.
    #
    # Kanade is PyTorch, and this repo previously chose `kokoro-onnx` over the
    # reference `kokoro` package specifically to keep torch out. That decision
    # is reversed here deliberately and with a measured reason: conversion is
    # the only thing that produced the intended voice, and it costs ~385ms and
    # ~2.5GB to get it. `kokoro-onnx` stays because speech/audition.py still
    # renders Kokoro voices to compare against.
    "kokoro-onnx>=0.4",
    "piper-tts>=1.6",
    "torch>=2.4",
    "torchaudio>=2.4",
    "soundfile>=0.12",
    "kanade-tokenizer @ git+https://github.com/frothywater/kanade-tokenizer",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
